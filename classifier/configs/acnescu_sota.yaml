# SOTA Baselines Config: AcneSCU
# Run: python run_sota_baselines.py --config acnescu_sota.yaml
# Experiments: Focal Loss, Class-Balanced Loss (Cui et al.), Zein Proxy

# --- Paths ---
real_root: /mnt/wd-ssd-4tb/acne_classifiers/datasets/image_restructured_acnescu
fake_root: /mnt/wd-ssd-4tb/acne_classifiers/datasets/sg2_gen/acnescu_images_fake_50k
real_subdir: null
benchmark_dir: /mnt/wd-ssd-4tb/acne_classifiers/experiments/benchmark-acneSCU-2025

exp_root: /mnt/wd-ssd-4tb/acne_classifiers/experiments/2026_sota_baselines/acnescu
tmp_parent: /mnt/wd-ssd-4tb/tmp

# --- Dataset settings ---
class_ids: [0, 1, 2, 3]
count_range: [0, 150]
seed: 42
fitness_metric: f1_macro_sane
allow_legacy_f1_fallback: false

# --- Champions (for reference) ---
ablation:
  champions:
    - name: g2_i5
      dna: [110, 4, 54, 44]
      optimizer: GA
    - name: bo_22
      dna: [112, 0, 7, 108]
      optimizer: BO

# --- Focal Loss settings ---
focal:
  gamma: 2.0

# --- Class-Balanced Loss settings (Cui et al. CVPR 2019) ---
class_balanced:
  beta: 0.9999

# --- Zein Proxy settings ---
# Per-class synthetic counts from Zein et al. (PLOS ONE 2024)
# Zein only experimented on ACNE04, but we apply same allocation
# to AcneSCU for completeness. Set enabled: false to skip.
zein_proxy:
  enabled: true
  counts: [1387, 841, 1173, 1086]

# --- Trainer settings (same as optimizer runs) ---
trainer_module: train_script_224
trainer_kwargs:
  sigma: 3.0
  lam: 0.6
  eval_head: combined
  img_size: 224
  resize_size: 256
  train_bs: 32
  eval_bs: 20
  num_workers: 8
  lr: 0.001
  lr_steps: [30, 60, 90]
  patience: 20
  save_epoch_csvs: false
  save_detail_csvs: false
  save_weights: false
